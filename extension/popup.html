<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailFlow Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrap">
    <!-- Top Header -->
    <header class="pop-header">
      <div class="pop-brand">
        <div class="pop-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="pop-brand-meta">
          <span class="pop-title">MailFlow</span>
          <span class="pop-version">v0.1.0</span>
        </div>
      </div>
      <button id="btn-refresh" class="btn-icon" title="Check backend connection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </header>

    <!-- Visual Connection Status Banner -->
    <div id="status-card" class="status-card checking">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <div class="status-text-wrap">
          <span id="status-title" class="status-title">Checking connection...</span>
          <span id="status-subtitle" class="status-subtitle">http://localhost:8000</span>
        </div>
      </div>
      <span id="status-latency" class="status-latency">-- ms</span>
    </div>

    <!-- Minimal Settings -->
    <div class="settings-section">
      <span class="section-heading">Protection Settings</span>

      <label class="setting-toggle" for="toggle-inline-scan">
        <div class="toggle-text">
          <span class="toggle-title">Inline Row Scanner</span>
          <span class="toggle-desc">Show scan button in Gmail email rows</span>
        </div>
        <div class="switch">
          <input type="checkbox" id="toggle-inline-scan" checked>
          <span class="slider"></span>
        </div>
      </label>

      <label class="setting-toggle" for="toggle-auto-shield">
        <div class="toggle-text">
          <span class="toggle-title">Auto Threat Guard</span>
          <span class="toggle-desc">Zero-trust defanging & triage hub</span>
        </div>
        <div class="switch">
          <input type="checkbox" id="toggle-auto-shield" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <!-- Notice if Offline -->
    <div id="offline-banner" class="offline-banner hidden">
      <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>Extension is paused until backend starts. Run <code>./start_backend.sh</code></span>
    </div>

    <!-- Minimal Footer -->
    <footer class="pop-footer">
      <span id="fleet-target">Fleet: Local Dev (Port 8000)</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
