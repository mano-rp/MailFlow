<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailFlow Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="pop-header">
      <div class="pop-brand">
        <div class="pop-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="pop-brand-text">
          <span class="pop-title">MailFlow</span>
          <span class="pop-subtitle">SME Email Security</span>
        </div>
      </div>
      
      <!-- Icon-Only Theme Switcher -->
      <div class="theme-toggle-group" role="radiogroup" aria-label="Appearance Theme">
        <button id="theme-btn-light" class="theme-btn active" title="Light Mode" aria-label="Light Mode" aria-checked="true" role="radio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button id="theme-btn-dark" class="theme-btn" title="Dark Mode" aria-label="Dark Mode" aria-checked="false" role="radio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Server Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <span id="status-dot" class="status-dot checking"></span>
        <span id="status-text" class="status-text">MailFlow Server</span>
      </div>
      <button id="btn-check-connection" class="btn-refresh" title="Check Connection" aria-label="Check Connection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </div>

    <!-- Hairline Divider -->
    <hr class="section-divider">

    <!-- Quick Scans Section -->
    <section class="actions-section">
      <div class="section-label">Quick Scans</div>

      <button id="btn-scan-page" class="pop-action-btn" title="Scan all visible emails on current page">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <span class="btn-title">Scan Page</span>
      </button>

      <button id="btn-scan-unread" class="pop-action-btn" title="Scan all unread emails">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span class="btn-title">Scan Unopened Mails</span>
      </button>

      <button id="btn-scan-selected" class="pop-action-btn" title="Scan all selected emails">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <span class="btn-title">Scan Selected Mails</span>
      </button>
    </section>

    <!-- Hairline Divider -->
    <hr class="section-divider">

    <!-- Preferences / Auto-forward Section -->
    <section class="preferences-section">
      <label class="setting-row" for="toggle-autoforward">
        <span class="setting-name">Auto-forward to SME Admin</span>
        <div class="m3-switch">
          <input type="checkbox" id="toggle-autoforward">
          <span class="m3-track"><span class="m3-thumb"></span></span>
        </div>
      </label>
    </section>

    <!-- Hairline Divider -->
    <hr class="section-divider">

    <!-- Minimal Footer -->
    <footer class="pop-footer">
      <span class="version-text">MailFlow v0.1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
